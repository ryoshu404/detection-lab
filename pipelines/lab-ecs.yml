# Maps Sigma rules onto the lab's Elastic ECS data streams. Scoped by logsource
# so it only touches the sources it names; other rules pass through untouched.
name: lab-ecs
priority: 20
transformations:
  # --- Windows Defender ---
  - id: set_defender_index
    type: set_state
    key: index
    val: logs-windows.windows_defender-*
    rule_conditions:
      - type: logsource
        product: windows
        service: windows-defender

  - id: map_eventid_to_eventcode
    type: field_name_mapping
    mapping:
      EventID: event.code
    rule_conditions:
      - type: logsource
        product: windows
        service: windows-defender

  # event.code is a keyword in ECS, so the value must be a string ("1116" not 1116).
  - id: eventcode_as_string
    type: convert_type
    target_type: str
    field_name_conditions:
      - type: include_fields
        fields:
          - event.code
    rule_conditions:
      - type: logsource
        product: windows
        service: windows-defender

  # --- Sysmon ---
  - id: set_sysmon_index
    type: set_state
    key: index
    val: logs-windows.sysmon_operational-*
    rule_conditions:
      - type: logsource
        product: windows
        service: sysmon

  - id: map_sysmon_fields
    type: field_name_mapping
    mapping:
      EventID: event.code
      TargetObject: registry.path
      Details: registry.data.strings
    rule_conditions:
      - type: logsource
        product: windows
        service: sysmon

  - id: sysmon_eventcode_as_string
    type: convert_type
    target_type: str
    field_name_conditions:
      - type: include_fields
        fields:
          - event.code
    rule_conditions:
      - type: logsource
        product: windows
        service: sysmon
