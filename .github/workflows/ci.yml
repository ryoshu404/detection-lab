# PR gate. Runs on GitHub-hosted runners with no lab access and no secrets, so
# it's safe on untrusted pull requests. Validates, compiles, scans fixtures for
# unscrubbed values, and set-equality tests every rule against its fixture.
name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate-and-compile:
    runs-on: ubuntu-latest

    # Pinned to the lab stack version so ES|QL behaviour is identical.
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.4.2
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms1g -Xmx1g
        ports:
          - 9200:9200

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install toolchain
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-pipeline.txt

      - name: Validate
        run: python deploy/validate.py detections/ --repo-root .

      - name: Compile
        run: python deploy/compile.py detections/ -p pipelines/lab-ecs.yml -f default

      - name: Scan fixtures for unscrubbed values
        run: python tests/scan_fixtures.py

      - name: Fixture set-equality tests
        run: pytest tests/ -v
