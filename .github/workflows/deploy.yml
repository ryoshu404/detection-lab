# Deploys rules to the lab SIEM on merge to main. Runs on the self-hosted runner
# inside the lab network, which holds the Elastic key — so it triggers ONLY on
# push to main, never on pull_request. That, plus the fork-approval repo setting,
# keeps untrusted pull requests off the runner.
#
# Uses builder's own Python 3.11 rather than actions/setup-python, which expects
# a GitHub-hosted image's cache that a self-hosted runner doesn't have.
name: deploy

on:
  push:
    branches: [main]
    paths: ["detections/**", "pipelines/**", "deploy/**", "requirements-pipeline.txt"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, deploy]
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements-pipeline.txt

      - name: Validate
        run: |
          . .venv/bin/activate
          python deploy/validate.py detections/ --repo-root .

      - name: Deploy to SIEM
        env:
          KIBANA_URL: ${{ secrets.KIBANA_URL }}
          KIBANA_API_KEY: ${{ secrets.KIBANA_API_KEY }}
        run: |
          . .venv/bin/activate
          python deploy/push.py detections/ -p pipelines/lab-ecs.yml
