notes: >
  Ran uname, cat /etc/*release, uptime and helper commands (cut, grep), parented to
  pwsh. auditd captured execve with full process.args. Parent relationship is flat —
  auditd does not reconstruct ancestry the way Sysmon does. GHOSTS jsmith activity in
  the same period includes cat /etc/os-release, which is the same discovery behaviour
  as this technique: a benign/attack collision worth carrying into the ADS doc.
